# Year configuration. Edit once per repo copy (one data year per repo).
year: 2025

sampling:
  spring_date: "2025-04-30"
  summer_date: "2025-07-23"

# Completeness goals: QAPP v3 (A 85%, B 60%); ADEC 2026 guidance range 80-90%
completeness:
  goal_a: 0.85
  goal_b: 0.60
  adec_min: 0.80
  adec_max: 0.90

# CDX project submission. qapp_filename is the PDF attached to the project in CDX
# (written to project.csv as ProjectAttachmentFileName); update it when a new QAPP version is approved.
cdx:
  # WQX organization ID; WQX Web prepends "<organization_id>-" to uploaded location and activity IDs (shown in Q31)
  organization_id: "KENAI_WQX"
  # Time zone the WQX Web import configuration applies to Activity Start and Analysis Start Time
  # Zone (a constant in the saved .cfg). Q32 checks every date is in this zone.
  import_config_time_zone: "AKDT"
  # Project metadata submitted to CDX (shown in Q30; confirm against WQX Web each year)
  project_id: 10000007
  project_name: "Agency Baseline"
  qapp_approved: "Yes"
  qapp_approval_agency: "EPA"
  project_description_url: "https://www.kenaiwatershed.org/kenai-river-baseline-water-quality-monitoring/"
  qapp_filename: "KenaiWatershedForum_QAPP_v3_2023_with_Addendum_April_2024.pdf"
  # Other documents attached to the project in CDX (listed in Q29 for you to confirm)
  supporting_documents: []

# Date reference/baseline_sites.csv was last compared with the WQP station list (shown in Q28)
sites:
  verified_date: "2026-11-25"

# All paths are relative to data/ (raw lab files for the working year only)
files:
  sgs:
    spring: {path: "spring_2025_wqx_data/SGS/spring_2025_kenai_baseline_sgs_results.xlsx", sheet: "Sheet8"}
    summer: {path: "summer_2025_wqx_data/SGS/summer_2025_kenai_baseline_results_sgs.xlsx", sheet: "Sheet8"}
  # TSS run_date/run_time: copy "DATE OF ANALYSIS" and "TIME" from the lab sheet header (required).
  # TSS receipt (rec_date, rec_time) is not in the lab file; copy from the chain of custody (optional, warns if blank).
  # FC receipt (rec_date, rec_time) is not in the lab file; copy it from the chain of custody.
  # Left blank, ingest_fc() warns and sets receipt to NA. Receipt times at the treatment plants are
  # sometimes hand-written, so the operator may need to enter them. Q17 uses receipt only as a cross-check.
  fc:
    spring: {path: "spring_2025_wqx_data/SWWTP/KRWF Fecal 04-30-25.xls", rec_date: ~, rec_time: ~}
    summer: {path: "summer_2025_wqx_data/SWWTP/KRWF Fecal 07-23-25.xls", rec_date: ~, rec_time: ~}
  tss:
    spring: {path: "spring_2025_wqx_data/SWWTP/KRWF TSS MONITORING 05-01-25.xlsx", sheet: "Updated_Formatting", run_date: "2025-05-01", run_time: "13:58", rec_date: ~, rec_time: ~}
    summer: {path: "summer_2025_wqx_data/SWWTP/KRWF TSS MONITORING 07-25-25.xls", sheet: "Updated_Formatting", run_date: "2025-07-25", run_time: "14:00", rec_date: ~, rec_time: ~}
  ysi:
    both: {path: "2025 Kenai Agency Baseline YSI ProQuatro and Turbidity Data.xlsx"}

sgs:
  # Trip blanks labelled "RMx&y trip blank" cover two sites; one row per site is created at ingest.
  trip_blank_sites:
    "RM1.5&6.5 trip blank": [10000002, 10000005]   # Kenai City Dock, Cunningham Park
    "RM40&43 trip blank":   [10000027, 10000028]   # Bing's Landing, Upstream of Dow Island

qc:
  # A failing lab blank rejects detected sample results below blank_multiple x the blank result
  # (same batch, analyte and method). The QAPP does not set a multiple; this is a project convention.
  blank_multiple: 5

tss:
  # Reporting limits for SM21-2540-+D (QAPP v3 Table 5). Check against the SWWTP lab report each year.
  # dl is the SGS-style detection limit (QAPP DL); lod is the cutoff for a "U" result (kept equal to dl).
  # The same limits apply to both the Soldotna and City of Kenai plants.
  dl: 0.31    # mg/L
  lod: 0.31   # mg/L
  loq: 1.0    # mg/L

ysi:
  # Values outside these limits are removed from dat and reported in `excluded` for manual review.
  # Corrections go in year_files/ysi_corrections.csv.
  ph_min: 0
  ph_max: 14
  do_max: 20   # mg/L
